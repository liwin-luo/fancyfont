<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #f6f1e7;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    position: relative;
  }
  .frame {
    position: absolute; inset: 24px;
    border: 4px solid #111;
    background: #fff;
    box-shadow: 10px 10px 0 #111;
    display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    padding: 60px 80px;
  }
  .logo {
    position: absolute; top: 44px; right: 56px;
    display: flex; align-items: center; gap: 12px;
    transform: rotate(3deg);
  }
  .logo-icon {
    width: 56px; height: 56px; background: #ffd23f;
    border: 4px solid #111; border-radius: 12px;
    box-shadow: 4px 4px 0 #111;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900; color: #111;
  }
  .logo-name { font-size: 30px; font-weight: 900; color: #111; letter-spacing: -0.5px; }
  .badge {
    display: inline-block; background: #ff5d8f; color: #fff;
    border: 4px solid #111; border-radius: 10px;
    padding: 8px 22px; font-size: 24px; font-weight: 900;
    box-shadow: 5px 5px 0 #111; transform: rotate(-2deg);
  }
  h1 {
    margin-top: 28px; font-size: 72px; font-weight: 900;
    color: #111; line-height: 1.15; letter-spacing: -1px;
  }
  h1 .fancy { color: #ff5d8f; }
  .sub {
    margin-top: 22px; font-size: 28px; font-weight: 700; color: #3d3a34;
    line-height: 1.5;
  }
  .samples {
    margin-top: 34px; display: flex; gap: 18px; flex-wrap: wrap;
  }
  .chip {
    border: 3px solid #111; border-radius: 10px; padding: 8px 18px;
    font-size: 28px; font-weight: 900; box-shadow: 4px 4px 0 #111;
  }
  .c1 { background: #ffd23f; transform: rotate(-1.5deg); }
  .c2 { background: #4d96ff; color: #fff; transform: rotate(1deg); }
  .c3 { background: #2ebd85; color: #fff; transform: rotate(-1deg); }
  .footer {
    position: absolute; bottom: 40px; left: 84px;
    font-size: 20px; font-weight: 700; color: #3d3a34;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="logo">
      <div class="logo-icon">字</div>
      <div class="logo-name">FancyFont</div>
    </div>
    <span class="badge">免费 · 本地转换 · 复制即用</span>
    <h1>花式字体生成器<br><span class="fancy">57</span> 种样式一键复制</h1>
    <div class="sub">英文变 30 种带样式 Unicode 字符,中文套 27 种环绕装饰</div>
    <div class="samples">
      <span class="chip c1">𝓗𝓮𝓵𝓵𝓸</span>
      <span class="chip c2">꧁清风꧂</span>
      <span class="chip c3">『等风来』</span>
    </div>
    <div class="footer">fancyfont.tools</div>
  </div>
</body>
</html>
